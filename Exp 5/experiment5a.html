<!DOCTYPE html>
<html>
<head>
    <title>Experiment 5 - Dynamic To-Do</title>
    <link rel="stylesheet" href="style.css">
    <style>
        body{
            margin:0;
            font-family:Arial, sans-serif;
            background:linear-gradient(135deg,#0f2027,#203a43,#2c5364);
            color:white;
            text-align:center;
            padding:40px;
        }

        h1{
            font-size:36px;
            text-shadow:0 0 20px #00f7ff;
        }

        .todo-box{
            margin:auto;
            width:500px;
            padding:30px;
            border-radius:20px;
            background:rgba(255,255,255,0.08);
            backdrop-filter:blur(10px);
            box-shadow:0 0 25px #00f7ff;
        }

        input{
            width:70%;
            padding:10px;
            border:none;
            border-radius:10px;
            outline:none;
        }

        button{
            padding:10px 15px;
            border:none;
            border-radius:10px;
            background:#00f7ff;
            color:black;
            font-weight:bold;
            cursor:pointer;
        }

        .tasks{
            margin-top:25px;
            display:flex;
            flex-direction:column;
            gap:15px;
        }

        .task-card{
            padding:15px;
            border-radius:12px;
            background:#1c2b38;
            display:flex;
            justify-content:space-between;
            align-items:center;
            box-shadow:0 0 10px #00f7ff;
            transition:0.3s;
        }

        .task-card.completed{
            text-decoration:line-through;
            opacity:0.6;
        }

        .delete-btn{
            background:red;
            color:white;
            padding:5px 8px;
            border-radius:8px;
            cursor:pointer;
        }
    </style>
</head>

<body>

<h1>⚡ Dynamic To-Do List Application ⚡</h1>

<div class="todo-box">
    <input type="text" id="taskInput" placeholder="Enter a task...">
    <button id="addBtn">Add Task</button>

    <div class="tasks" id="taskContainer"></div>
</div>

<script src="script.js"></script>

</body>
</html>
