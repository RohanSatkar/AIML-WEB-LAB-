<!DOCTYPE html>
<html>
<head>
    <title>Interactive Webpage - Enhanced</title>
    <link rel="stylesheet" href="style1.css">
</head>
<body>

    <div class="container">
        <h1>✨ Interactive JavaScript Web App</h1>

        <!-- Button Section -->
        <div class="card">
            <h2>Button Click Event</h2>
            <button id="clickBtn" class="btn">Click Me</button>
            <p id="clickMessage"></p>
        </div>

        <!-- Hover Section -->
        <div class="card">
            <h2>Mouse Hover Effect</h2>
            <div id="hoverBox" class="hover-box">
                Hover Over Me
            </div>
        </div>

        <!-- Keyup Section -->
        <div class="card">
            <h2>Live Name Preview</h2>
            <input type="text" id="nameInput" placeholder="Type your name">
            <p id="nameOutput"></p>
        </div>

        <!-- Form Section -->
        <div class="card">
            <h2>Email Form</h2>
            <form id="myForm">
                <input type="email" id="email" placeholder="Enter Email" required>
                <button type="submit" class="btn">Submit</button>
            </form>
            <p id="formMessage"></p>
        </div>
    </div>

    <script src="script1.js"></script>
</body>
</html>
