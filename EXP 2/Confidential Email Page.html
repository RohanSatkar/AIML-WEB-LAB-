<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Confidential Email</title>
    <link rel="stylesheet" href="style6.css">
</head>
<body>

<main id="email">
    <!-- Confidential & Top Secret tags -->
    <div id="confidential">CONFIDENTIAL</div>
    <div id="top-secret">TOP SECRET</div>

    <!-- Paragraphs with blurred spans -->
    <p>This is a <span class="blurred">sensitive</span> message for your eyes only.</p>
    <p>Please keep the <span class="blurred">information</span> secure at all times.</p>
    <p>Do not share the <span class="blurred">details</span> with unauthorized personnel.</p>
</main>

</body>
</html>
